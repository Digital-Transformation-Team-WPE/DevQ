name: Deploy to IIS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish application
        run: dotnet publish ChecklistMaster.Server/ChecklistMaster.Server.csproj -c Release -o ./publish

      - name: Stop IIS App Pool
        shell: cmd
        run: |
          REM Stop the app pool using appcmd.exe with admin privileges
          "%windir%\system32\inetsrv\appcmd.exe" stop apppool /apppool.name:"Default Web Site"
          REM Wait for app pool to stop (optional timeout)
          timeout /t 5 /nobreak

      - name: Deploy files
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set "dest=C:\Myapps\RSTUDIO"
          if not exist "!dest!" mkdir "!dest!"
          robocopy .\publish "!dest!" /MIR /NJH /NJS /NFL /NDL /NC /NS /NP
          if !errorlevel! leq 7 (exit /b 0) else (exit /b !errorlevel!)

      - name: Start IIS App Pool
        shell: cmd
        if: always()
        run: |
          REM Start the app pool using appcmd.exe with admin privileges
          "%windir%\system32\inetsrv\appcmd.exe" start apppool /apppool.name:"Default Web Site"
